sql: "SELECT 'silver_events' AS table_name, f.file_count, f.avg_file_mb, f.row_count,\n\
  \       (SELECT max(updated_at) FROM \"ecommerce_lakehouse\".\"silver_events\")\
  \ AS last_updated_at\nFROM (SELECT count(*) AS file_count, round(avg(file_size_in_bytes)\
  \ / 1048576.0, 2) AS avg_file_mb,\n             sum(record_count) AS row_count\n\
  \      FROM \"ecommerce_lakehouse\".\"silver_events$files\" WHERE content = 0) f\n\
  UNION ALL\nSELECT 'silver_funnel', f.file_count, f.avg_file_mb, f.row_count,\n \
  \      (SELECT max(updated_at) FROM \"ecommerce_lakehouse\".\"silver_funnel\")\n\
  FROM (SELECT count(*) AS file_count, round(avg(file_size_in_bytes) / 1048576.0,\
  \ 2) AS avg_file_mb,\n             sum(record_count) AS row_count\n      FROM \"\
  ecommerce_lakehouse\".\"silver_funnel$files\" WHERE content = 0) f\nUNION ALL\n\
  SELECT 'gold_daily_gmv', f.file_count, f.avg_file_mb, f.row_count,\n       (SELECT\
  \ max(updated_at) FROM \"ecommerce_lakehouse\".\"gold_daily_gmv\")\nFROM (SELECT\
  \ count(*) AS file_count, round(avg(file_size_in_bytes) / 1048576.0, 2) AS avg_file_mb,\n\
  \             sum(record_count) AS row_count\n      FROM \"ecommerce_lakehouse\"\
  .\"gold_daily_gmv$files\" WHERE content = 0) f\nUNION ALL\nSELECT 'gold_funnel_daily',\
  \ f.file_count, f.avg_file_mb, f.row_count,\n       (SELECT max(updated_at) FROM\
  \ \"ecommerce_lakehouse\".\"gold_funnel_daily\")\nFROM (SELECT count(*) AS file_count,\
  \ round(avg(file_size_in_bytes) / 1048576.0, 2) AS avg_file_mb,\n             sum(record_count)\
  \ AS row_count\n      FROM \"ecommerce_lakehouse\".\"gold_funnel_daily$files\" WHERE\
  \ content = 0) f\nUNION ALL\nSELECT 'gold_category_gmv', f.file_count, f.avg_file_mb,\
  \ f.row_count,\n       (SELECT max(updated_at) FROM \"ecommerce_lakehouse\".\"gold_category_gmv\"\
  )\nFROM (SELECT count(*) AS file_count, round(avg(file_size_in_bytes) / 1048576.0,\
  \ 2) AS avg_file_mb,\n             sum(record_count) AS row_count\n      FROM \"\
  ecommerce_lakehouse\".\"gold_category_gmv$files\" WHERE content = 0) f\nUNION ALL\n\
  SELECT 'gold_pipeline_sla', f.file_count, f.avg_file_mb, f.row_count,\n       (SELECT\
  \ max(updated_at) FROM \"ecommerce_lakehouse\".\"gold_pipeline_sla\")\nFROM (SELECT\
  \ count(*) AS file_count, round(avg(file_size_in_bytes) / 1048576.0, 2) AS avg_file_mb,\n\
  \             sum(record_count) AS row_count\n      FROM \"ecommerce_lakehouse\"\
  .\"gold_pipeline_sla$files\" WHERE content = 0) f\nUNION ALL\nSELECT 'gold_data_quality',\
  \ f.file_count, f.avg_file_mb, f.row_count,\n       (SELECT max(updated_at) FROM\
  \ \"ecommerce_lakehouse\".\"gold_data_quality\")\nFROM (SELECT count(*) AS file_count,\
  \ round(avg(file_size_in_bytes) / 1048576.0, 2) AS avg_file_mb,\n             sum(record_count)\
  \ AS row_count\n      FROM \"ecommerce_lakehouse\".\"gold_data_quality$files\" WHERE\
  \ content = 0) f\n"
