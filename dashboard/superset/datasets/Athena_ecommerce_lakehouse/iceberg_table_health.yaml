table_name: iceberg_table_health
main_dttm_col: last_updated_at
description: "Iceberg 현재 스냅샷의 파일 수, 평\
  균 파일 크기, 행 수, 최종 갱신 시\
  각"
default_endpoint: null
offset: 0
cache_timeout: 86400
catalog: null
schema: ecommerce_lakehouse
sql: |
  SELECT 'silver_events' AS table_name, f.file_count, f.avg_file_mb, f.row_count,
         (SELECT max(committed_at) FROM "ecommerce_lakehouse"."silver_events$snapshots") AS last_updated_at
  FROM (SELECT count(*) AS file_count, round(avg(file_size_in_bytes) / 1048576.0, 2) AS avg_file_mb,
               sum(record_count) AS row_count
        FROM "ecommerce_lakehouse"."silver_events$files" WHERE content = 0) f
  UNION ALL
  SELECT 'silver_funnel', f.file_count, f.avg_file_mb, f.row_count,
         (SELECT max(committed_at) FROM "ecommerce_lakehouse"."silver_funnel$snapshots")
  FROM (SELECT count(*) AS file_count, round(avg(file_size_in_bytes) / 1048576.0, 2) AS avg_file_mb,
               sum(record_count) AS row_count
        FROM "ecommerce_lakehouse"."silver_funnel$files" WHERE content = 0) f
  UNION ALL
  SELECT 'gold_daily_gmv', f.file_count, f.avg_file_mb, f.row_count,
         (SELECT max(committed_at) FROM "ecommerce_lakehouse"."gold_daily_gmv$snapshots")
  FROM (SELECT count(*) AS file_count, round(avg(file_size_in_bytes) / 1048576.0, 2) AS avg_file_mb,
               sum(record_count) AS row_count
        FROM "ecommerce_lakehouse"."gold_daily_gmv$files" WHERE content = 0) f
  UNION ALL
  SELECT 'gold_funnel_daily', f.file_count, f.avg_file_mb, f.row_count,
         (SELECT max(committed_at) FROM "ecommerce_lakehouse"."gold_funnel_daily$snapshots")
  FROM (SELECT count(*) AS file_count, round(avg(file_size_in_bytes) / 1048576.0, 2) AS avg_file_mb,
               sum(record_count) AS row_count
        FROM "ecommerce_lakehouse"."gold_funnel_daily$files" WHERE content = 0) f
  UNION ALL
  SELECT 'gold_category_gmv', f.file_count, f.avg_file_mb, f.row_count,
         (SELECT max(committed_at) FROM "ecommerce_lakehouse"."gold_category_gmv$snapshots")
  FROM (SELECT count(*) AS file_count, round(avg(file_size_in_bytes) / 1048576.0, 2) AS avg_file_mb,
               sum(record_count) AS row_count
        FROM "ecommerce_lakehouse"."gold_category_gmv$files" WHERE content = 0) f
  UNION ALL
  SELECT 'gold_pipeline_sla', f.file_count, f.avg_file_mb, f.row_count,
         (SELECT max(committed_at) FROM "ecommerce_lakehouse"."gold_pipeline_sla$snapshots")
  FROM (SELECT count(*) AS file_count, round(avg(file_size_in_bytes) / 1048576.0, 2) AS avg_file_mb,
               sum(record_count) AS row_count
        FROM "ecommerce_lakehouse"."gold_pipeline_sla$files" WHERE content = 0) f
  UNION ALL
  SELECT 'gold_data_quality', f.file_count, f.avg_file_mb, f.row_count,
         (SELECT max(committed_at) FROM "ecommerce_lakehouse"."gold_data_quality$snapshots")
  FROM (SELECT count(*) AS file_count, round(avg(file_size_in_bytes) / 1048576.0, 2) AS avg_file_mb,
               sum(record_count) AS row_count
        FROM "ecommerce_lakehouse"."gold_data_quality$files" WHERE content = 0) f
