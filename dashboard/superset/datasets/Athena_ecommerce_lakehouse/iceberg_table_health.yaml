table_name: iceberg_table_health
main_dttm_col: last_updated_at
description: "Iceberg 현재 스냅샷의 파티션·data 파일 현황(파일 수, 파티션당 복수 파일 수, 평균 크기, Silver의 목표 크기 미달 수), position delete 파일·레코드 수, 최종 갱신 시각. data_record_count는 data file 기준이라 MOR인 Silver의 실제 행 수가 아니다"
default_endpoint: null
offset: 0
cache_timeout: 3600
catalog: null
schema: ecommerce_lakehouse
sql: |
  -- Athena의 $files는 data 파일만 노출한다(content=1 행이 없어 delete 집계가 불가능하다).
  -- Spark의 .files와 다른 점이라 delete 지표는 현재 스냅샷의 summary에서 가져온다.
  -- 파티션 단위 지표도 $files에 partition 컬럼이 없어 $partitions에서 따로 구한다.
  -- 128MB는 Silver의 write.target-file-size-bytes다. 일별 집계인 Gold는 모든 파일이
  -- 항상 미달이라 신호가 되지 못하므로 NULL로 두고, Gold의 신호는 multi_file_partition_count다.
  WITH f AS (
    SELECT 'silver_events' AS table_name,
           count(*) AS data_file_count,
           sum(file_size_in_bytes) AS data_bytes,
           sum(CASE WHEN file_size_in_bytes < 134217728 THEN 1 ELSE 0 END) AS small_data_file_count,
           sum(record_count) AS data_record_count
    FROM "ecommerce_lakehouse"."silver_events$files"
    UNION ALL
    SELECT 'silver_funnel' AS table_name,
           count(*) AS data_file_count,
           sum(file_size_in_bytes) AS data_bytes,
           sum(CASE WHEN file_size_in_bytes < 134217728 THEN 1 ELSE 0 END) AS small_data_file_count,
           sum(record_count) AS data_record_count
    FROM "ecommerce_lakehouse"."silver_funnel$files"
    UNION ALL
    SELECT 'gold_daily_gmv' AS table_name,
           count(*) AS data_file_count,
           sum(file_size_in_bytes) AS data_bytes,
           CAST(NULL AS BIGINT) AS small_data_file_count,
           sum(record_count) AS data_record_count
    FROM "ecommerce_lakehouse"."gold_daily_gmv$files"
    UNION ALL
    SELECT 'gold_funnel_daily' AS table_name,
           count(*) AS data_file_count,
           sum(file_size_in_bytes) AS data_bytes,
           CAST(NULL AS BIGINT) AS small_data_file_count,
           sum(record_count) AS data_record_count
    FROM "ecommerce_lakehouse"."gold_funnel_daily$files"
    UNION ALL
    SELECT 'gold_category_gmv' AS table_name,
           count(*) AS data_file_count,
           sum(file_size_in_bytes) AS data_bytes,
           CAST(NULL AS BIGINT) AS small_data_file_count,
           sum(record_count) AS data_record_count
    FROM "ecommerce_lakehouse"."gold_category_gmv$files"
    UNION ALL
    SELECT 'gold_pipeline_sla' AS table_name,
           count(*) AS data_file_count,
           sum(file_size_in_bytes) AS data_bytes,
           CAST(NULL AS BIGINT) AS small_data_file_count,
           sum(record_count) AS data_record_count
    FROM "ecommerce_lakehouse"."gold_pipeline_sla$files"
    UNION ALL
    SELECT 'gold_data_quality' AS table_name,
           count(*) AS data_file_count,
           sum(file_size_in_bytes) AS data_bytes,
           CAST(NULL AS BIGINT) AS small_data_file_count,
           sum(record_count) AS data_record_count
    FROM "ecommerce_lakehouse"."gold_data_quality$files"
  ),
  p AS (
    SELECT 'silver_events' AS table_name,
           count(*) AS partition_count,
           sum(CASE WHEN file_count > 1 THEN 1 ELSE 0 END) AS multi_file_partition_count,
           max(file_count) AS max_files_in_partition
    FROM "ecommerce_lakehouse"."silver_events$partitions"
    UNION ALL
    SELECT 'silver_funnel' AS table_name,
           count(*) AS partition_count,
           sum(CASE WHEN file_count > 1 THEN 1 ELSE 0 END) AS multi_file_partition_count,
           max(file_count) AS max_files_in_partition
    FROM "ecommerce_lakehouse"."silver_funnel$partitions"
    UNION ALL
    SELECT 'gold_daily_gmv' AS table_name,
           count(*) AS partition_count,
           sum(CASE WHEN file_count > 1 THEN 1 ELSE 0 END) AS multi_file_partition_count,
           max(file_count) AS max_files_in_partition
    FROM "ecommerce_lakehouse"."gold_daily_gmv$partitions"
    UNION ALL
    SELECT 'gold_funnel_daily' AS table_name,
           count(*) AS partition_count,
           sum(CASE WHEN file_count > 1 THEN 1 ELSE 0 END) AS multi_file_partition_count,
           max(file_count) AS max_files_in_partition
    FROM "ecommerce_lakehouse"."gold_funnel_daily$partitions"
    UNION ALL
    SELECT 'gold_category_gmv' AS table_name,
           count(*) AS partition_count,
           sum(CASE WHEN file_count > 1 THEN 1 ELSE 0 END) AS multi_file_partition_count,
           max(file_count) AS max_files_in_partition
    FROM "ecommerce_lakehouse"."gold_category_gmv$partitions"
    UNION ALL
    SELECT 'gold_pipeline_sla' AS table_name,
           count(*) AS partition_count,
           sum(CASE WHEN file_count > 1 THEN 1 ELSE 0 END) AS multi_file_partition_count,
           max(file_count) AS max_files_in_partition
    FROM "ecommerce_lakehouse"."gold_pipeline_sla$partitions"
    UNION ALL
    SELECT 'gold_data_quality' AS table_name,
           count(*) AS partition_count,
           sum(CASE WHEN file_count > 1 THEN 1 ELSE 0 END) AS multi_file_partition_count,
           max(file_count) AS max_files_in_partition
    FROM "ecommerce_lakehouse"."gold_data_quality$partitions"
  ),
  s AS (
    SELECT table_name, committed_at AS last_updated_at,
           position_delete_file_count, position_delete_record_count
    FROM (
    SELECT 'silver_events' AS table_name, committed_at,
           CAST(summary['total-delete-files'] AS BIGINT) AS position_delete_file_count,
           CAST(summary['total-position-deletes'] AS BIGINT) AS position_delete_record_count,
           row_number() OVER (ORDER BY committed_at DESC) AS rn
    FROM "ecommerce_lakehouse"."silver_events$snapshots"
    UNION ALL
    SELECT 'silver_funnel' AS table_name, committed_at,
           CAST(summary['total-delete-files'] AS BIGINT) AS position_delete_file_count,
           CAST(summary['total-position-deletes'] AS BIGINT) AS position_delete_record_count,
           row_number() OVER (ORDER BY committed_at DESC) AS rn
    FROM "ecommerce_lakehouse"."silver_funnel$snapshots"
    UNION ALL
    SELECT 'gold_daily_gmv' AS table_name, committed_at,
           CAST(summary['total-delete-files'] AS BIGINT) AS position_delete_file_count,
           CAST(summary['total-position-deletes'] AS BIGINT) AS position_delete_record_count,
           row_number() OVER (ORDER BY committed_at DESC) AS rn
    FROM "ecommerce_lakehouse"."gold_daily_gmv$snapshots"
    UNION ALL
    SELECT 'gold_funnel_daily' AS table_name, committed_at,
           CAST(summary['total-delete-files'] AS BIGINT) AS position_delete_file_count,
           CAST(summary['total-position-deletes'] AS BIGINT) AS position_delete_record_count,
           row_number() OVER (ORDER BY committed_at DESC) AS rn
    FROM "ecommerce_lakehouse"."gold_funnel_daily$snapshots"
    UNION ALL
    SELECT 'gold_category_gmv' AS table_name, committed_at,
           CAST(summary['total-delete-files'] AS BIGINT) AS position_delete_file_count,
           CAST(summary['total-position-deletes'] AS BIGINT) AS position_delete_record_count,
           row_number() OVER (ORDER BY committed_at DESC) AS rn
    FROM "ecommerce_lakehouse"."gold_category_gmv$snapshots"
    UNION ALL
    SELECT 'gold_pipeline_sla' AS table_name, committed_at,
           CAST(summary['total-delete-files'] AS BIGINT) AS position_delete_file_count,
           CAST(summary['total-position-deletes'] AS BIGINT) AS position_delete_record_count,
           row_number() OVER (ORDER BY committed_at DESC) AS rn
    FROM "ecommerce_lakehouse"."gold_pipeline_sla$snapshots"
    UNION ALL
    SELECT 'gold_data_quality' AS table_name, committed_at,
           CAST(summary['total-delete-files'] AS BIGINT) AS position_delete_file_count,
           CAST(summary['total-position-deletes'] AS BIGINT) AS position_delete_record_count,
           row_number() OVER (ORDER BY committed_at DESC) AS rn
    FROM "ecommerce_lakehouse"."gold_data_quality$snapshots"
    ) ranked
    WHERE rn = 1
  )
  SELECT f.table_name,
         p.partition_count,
         f.data_file_count,
         p.multi_file_partition_count,
         p.max_files_in_partition,
         f.small_data_file_count,
         round(f.data_bytes / 1048576.0 / nullif(f.data_file_count, 0), 2) AS avg_data_file_mb,
         f.data_record_count,
         s.position_delete_file_count,
         s.position_delete_record_count,
         s.last_updated_at
  FROM f
  JOIN p ON p.table_name = f.table_name
  JOIN s ON s.table_name = f.table_name
