global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: kafka-broker
    static_configs:
      - targets: ["kafka:9404"]

  - job_name: flink-jobmanager
    static_configs:
      - targets: ["jobmanager:9249"]

  - job_name: flink-taskmanager
    static_configs:
      - targets: ["taskmanager:9249"]
